{% extends "base.html" %}
{% block title %}{{ t('register_title') }}{% endblock %}
{% block content %}
<div class="container">
  <div class="card">
    <h1>{{ t('register_title') }}</h1>
    {% if ref_name %}
    <div class="alert alert-ok">🎁 {{ t('ref_invite_note').format(name=ref_name) }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label for="name">{{ t('name') }}</label>
        <input id="name" name="name" type="text" required
               value="{{ request.form.get('name', '') }}">
      </div>
      <div class="form-group">
        <label for="phone">{{ t('phone') }}</label>
        <input id="phone" name="phone" type="tel" required
               value="{{ request.form.get('phone', '') }}">
      </div>
      <div class="form-group">
        <label for="password">{{ t('password') }}</label>
        <input id="password" name="password" type="password" required minlength="6">
      </div>
      <div class="form-group">
        <label>{{ t('role') }}</label>
        <label class="role-pick"><input type="radio" name="role" value="renter"
          {% if request.form.get('role', 'renter') == 'renter' %}checked{% endif %}>
          {{ t('role_renter') }}</label><br>
        <label class="role-pick"><input type="radio" name="role" value="landlord"
          {% if request.form.get('role') == 'landlord' %}checked{% endif %}>
          {{ t('role_landlord') }}</label>
      </div>
      <div class="form-group">
        <label for="city">{{ t('city') }}</label>
        <select id="city" name="city">
          {% for c in cities %}
          <option value="{{ c }}" {% if request.form.get('city') == c %}selected{% endif %}>
            {{ city_name(c) }}</option>
          {% endfor %}
        </select>
      </div>
      <button class="btn btn-primary" type="submit">{{ t('register_title') }}</button>
    </form>
    <p><a href="{{ url_for('auth.login') }}">{{ t('have_account') }}</a></p>
  </div>
</div>
{% endblock %}
