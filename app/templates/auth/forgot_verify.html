{% extends "base.html" %}
{% block title %}{{ t('forgot_title') }}{% endblock %}
{% block content %}
<div class="container">
  <div class="card">
    <h1>{{ t('forgot_title') }}</h1>
    <p class="muted">{{ t('forgot_step2_hint') }}</p>
    <form method="post" action="{{ url_for('auth.forgot_verify') }}">
      <div class="form-group">
        <label for="code">{{ t('otp_code') }}</label>
        <input id="code" name="code" type="text" inputmode="numeric" maxlength="6" required
               style="font-size:1.5em;letter-spacing:0.3em;text-align:center">
      </div>
      <button class="btn btn-primary" type="submit">{{ t('verify_otp') }}</button>
    </form>
    <p><a href="{{ url_for('auth.forgot_password') }}">{{ t('resend_otp') }}</a></p>
  </div>
</div>
{% endblock %}
