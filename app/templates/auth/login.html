{% extends "base.html" %}
{% block title %}{{ t('login_title') }}{% endblock %}
{% block content %}
<div class="container">
  <div class="card">
    <h1>{{ t('login_title') }}</h1>
    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
      <div class="form-group">
        <label for="phone">{{ t('phone') }}</label>
        <input id="phone" name="phone" type="tel" required
               value="{{ request.form.get('phone', '') }}">
      </div>
      <div class="form-group">
        <label for="password">{{ t('password') }}</label>
        <input id="password" name="password" type="password" required>
      </div>
      <button class="btn btn-primary" type="submit">{{ t('login_title') }}</button>
    </form>
    <p><a href="{{ url_for('auth.register') }}">{{ t('no_account') }}</a></p>
    <p><a href="{{ url_for('auth.forgot_password') }}">{{ t('forgot_title') }}</a></p>
  </div>
</div>
{% endblock %}
