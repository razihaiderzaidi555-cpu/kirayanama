{% extends "base.html" %}
{% block title %}{{ t('forgot_title') }}{% endblock %}
{% block content %}
<div class="container">
  <div class="card">
    <h1>{{ t('forgot_title') }}</h1>
    <p class="muted">{{ t('forgot_step1_hint') }}</p>
    <form method="post" action="{{ url_for('auth.forgot_password') }}">
      <div class="form-group">
        <label for="phone">{{ t('phone') }}</label>
        <input id="phone" name="phone" type="tel" required>
      </div>
      <button class="btn btn-primary" type="submit">{{ t('send_otp') }}</button>
    </form>
    <p><a href="{{ url_for('auth.login') }}">{{ t('nav_login') }}</a></p>
  </div>
</div>
{% endblock %}
