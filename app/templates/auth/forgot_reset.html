{% extends "base.html" %}
{% block title %}{{ t('forgot_title') }}{% endblock %}
{% block content %}
<div class="container">
  <div class="card">
    <h1>{{ t('new_password_title') }}</h1>
    <form method="post" action="{{ url_for('auth.forgot_reset') }}">
      <div class="form-group">
        <label for="password">{{ t('password') }}</label>
        <input id="password" name="password" type="password" required minlength="6">
      </div>
      <div class="form-group">
        <label for="password2">{{ t('password2') }}</label>
        <input id="password2" name="password2" type="password" required minlength="6">
      </div>
      <button class="btn btn-primary" type="submit">{{ t('save') }}</button>
    </form>
  </div>
</div>
{% endblock %}
