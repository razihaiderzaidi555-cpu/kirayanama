{% extends "base.html" %}
{% block title %}{{ t('admin_settings') }}{% endblock %}
{% block content %}
<div class="container">
  <h1>{{ t('admin_settings') }}</h1>
  <p><a href="{{ url_for('admin.dashboard') }}">&larr; {{ t('back') }}</a></p>
  <div class="card">
    <p class="alert alert-ok">{{ t('demo_note') }}</p>
    <form method="post" action="{{ url_for('admin.settings') }}">
      <div class="form-group">
        <label for="hostel_fee_amount">{{ t('hostel_fee_amount') }}</label>
        <input type="text" id="hostel_fee_amount" name="hostel_fee_amount" value="{{ hostel_fee_amount }}" dir="ltr" inputmode="numeric">
      </div>
      <div class="form-group">
        <label for="open_districts">{{ t('open_districts_label') }}</label>
        <input type="text" id="open_districts" name="open_districts" value="{{ open_districts }}" dir="ltr">
        <small class="muted">{{ t('open_districts_hint') }}</small>
      </div>
      <div class="form-group">
        <label for="jazzcash_number">{{ t('jazzcash_number') }}</label>
        <input type="text" id="jazzcash_number" name="jazzcash_number" value="{{ jazzcash_number }}" dir="ltr">
      </div>
      <div class="form-group">
        <label for="easypaisa_number">{{ t('easypaisa_number') }}</label>
        <input type="text" id="easypaisa_number" name="easypaisa_number" value="{{ easypaisa_number }}" dir="ltr">
      </div>
      <div class="form-group">
        <label for="upaisa_number">{{ t('upaisa_number') }}</label>
        <input type="text" id="upaisa_number" name="upaisa_number" value="{{ upaisa_number }}" dir="ltr">
      </div>
      <div class="form-group">
        <label for="hbl_account">{{ t('hbl_account') }}</label>
        <input type="text" id="hbl_account" name="hbl_account" value="{{ hbl_account }}" dir="ltr">
      </div>
      <button type="submit" class="btn btn-primary">{{ t('save_settings') }}</button>
    </form>
  </div>
  <div class="card">
    <div class="form-group">
      <label>{{ t('alert_token_label') }}</label>
      <input type="text" value="{{ alert_token }}" dir="ltr" readonly onclick="this.select()">
    </div>
  </div>
</div>
{% endblock %}
