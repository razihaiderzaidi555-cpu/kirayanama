{% extends "base.html" %}
{% block title %}{{ t('agent_new') if not rc else t('agent_edit') }}{% endblock %}
{% block content %}
<div class="container">
  <h1>{{ t('agent_new') if not rc else t('agent_edit') }}</h1>
  <p><a href="{{ url_for('admin.agents') }}">&larr; {{ t('back') }}</a></p>
  <div class="card">
    <form method="post">
      <label>{{ t('agent_code') }}<br>
        {% if rc %}
        <input type="text" value="{{ rc.code }}" disabled>
        {% else %}
        <input type="text" name="code" required placeholder="ahmed-lhr" pattern="[a-z0-9\-]+" title="a-z 0-9 -">
        <small>{{ t('agent_code_hint') }}</small>
        {% endif %}
      </label><br><br>
      <label>{{ t('agent_name') }}<br>
        <input type="text" name="agent_name" required value="{{ rc.agent_name if rc else '' }}">
      </label><br><br>
      <label>{{ t('agent_territory') }}<br>
        <input type="text" name="territory" value="{{ rc.territory if rc else '' }}" placeholder="{{ t('agent_territory_hint') }}">
      </label><br><br>
      <label>{{ t('agent_rate') }}<br>
        <input type="number" name="per_listing_rate" min="1" value="{{ rc.per_listing_rate if rc else 150 }}">
        <small>{{ t('agent_rate_hint') }}</small>
      </label><br><br>
      <button type="submit" class="btn btn-primary">{{ t('save') }}</button>
    </form>
  </div>
</div>
{% endblock %}
